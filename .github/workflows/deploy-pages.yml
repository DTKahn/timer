name: Redirect old GitHub Pages address

# The web app now lives on Vercel at https://colorchime.com (see vercel.json).
# This only publishes a redirect page: old dtkahn.github.io/timer links land on
# the same page at the new address, and old home-screen icons show how to
# re-add the app from colorchime.com (leaving would drop them out of full screen).

on:
  push:
    branches: [main]
    paths:
      - pages-redirect/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages serves 404.html for every unknown path, so /timer/history also redirects.
      - run: |
          mkdir site
          cp pages-redirect/index.html site/index.html
          cp pages-redirect/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
