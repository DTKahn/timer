<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Expo's default page, plus settings for running from the iPhone home screen.
      viewport-fit=cover and the translucent status bar make the page fill the whole screen in
      every orientation; the app pads around the notch and status bar itself (SafeAreaView).
      Without them iOS reserves the status bar's height at the top in portrait and, on some
      iPhones (like the mini), keeps it after turning sideways: the page shows shifted down while
      overlays stay put, so taps land in the wrong place.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Matches the app's background (constants/theme.ts), so any edge iOS shows while rotating blends in. */
      html {
        background-color: #e9ecef;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #141619;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
