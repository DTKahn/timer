<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Expo's default page, plus settings for running from the iPhone home screen.
      viewport-fit=cover and the translucent status bar make the page fill the whole screen in
      every orientation; the app pads around the notch and status bar itself (SafeAreaView).
      Without them iOS reserves the status bar's height at the top in portrait and, on some
      iPhones (like the mini), keeps it after turning sideways: the page shows shifted down while
      overlays stay put, so taps land in the wrong place.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        iOS 26 Home Screen apps can get a window shorter than the screen by the status bar's
        height (WebKit bug 301108), leaving a gap at the bottom. The script below measures what's
        missing into --ios-shim (0 everywhere else) and these extend the page, and the pickers'
        overlays, which are pinned to the window's edges, down to the real bottom.
      */
      html {
        height: calc(100% + var(--ios-shim, 0px));
      }
      [aria-modal='true'] {
        bottom: calc(0px - var(--ios-shim, 0px)) !important;
      }
      /* Matches the app's background (constants/theme.ts), so any edge iOS shows while rotating blends in. */
      html {
        background-color: #e9ecef;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #141619;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      (function () {
        // How much shorter than the screen iOS made the window (see --ios-shim above). Only in
        // Home Screen apps that span the screen's full width, and only for a status-bar-sized
        // gap, so iPad windows and anything unexpected are left alone.
        function shim() {
          var gap = 0;
          if (navigator.standalone && window.screen) {
            var sideways = window.innerWidth > window.innerHeight;
            var long = Math.max(screen.width, screen.height);
            var short = Math.min(screen.width, screen.height);
            var fullWidth = sideways ? long : short;
            var fullHeight = sideways ? short : long;
            var missing = fullHeight - window.innerHeight;
            if (Math.abs(window.innerWidth - fullWidth) <= 1 && missing > 0 && missing <= 80) gap = missing;
          }
          document.documentElement.style.setProperty('--ios-shim', gap + 'px');
        }
        // The page is never scrolled by the app, only views inside it. iOS can leave it scrolled
        // after turning the phone, shifting everything up, so put it back at the top.
        function reset() {
          if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
          var el = document.scrollingElement || document.documentElement;
          if (el.scrollTop) el.scrollTop = 0;
          if (document.body.scrollTop) document.body.scrollTop = 0;
        }
        function update() {
          shim();
          reset();
        }
        function settle() {
          update();
          // iOS finishes the rotation over a few frames; check again once it's done.
          requestAnimationFrame(update);
          setTimeout(update, 300);
        }
        update();
        window.addEventListener('scroll', reset, { passive: true });
        window.addEventListener('resize', settle);
        window.addEventListener('orientationchange', settle);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', settle);
      })();
    </script>
  </body>
</html>
