<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Timer has moved</title>
    <link rel="canonical" href="https://colorchime.com/" />
    <!-- Only for visitors without JavaScript; the script below keeps the path. -->
    <noscript><meta http-equiv="refresh" content="0; url=https://colorchime.com/" /></noscript>
    <script>
      // redirectTarget:start
      function redirectTarget(loc) {
        var path = loc.pathname.replace(/^\/timer(?=\/|$)/, '') || '/';
        return 'https://colorchime.com' + path + loc.search + loc.hash;
      }

      // Opened from a home-screen icon saved at the old address. Jumping to
      // another site from there leaves the full-screen app, so explain instead.
      function isHomeScreenApp(win) {
        if (win.navigator.standalone === true) return true;
        return !!(win.matchMedia && win.matchMedia('(display-mode: standalone)').matches);
      }
      // redirectTarget:end

      var target = redirectTarget(location);
      if (!isHomeScreenApp(window)) location.replace(target);
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('link').href = target;
        if (isHomeScreenApp(window)) document.body.className = 'home-screen';
      });
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 18px;
        line-height: 1.5;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 0 16px;
        box-sizing: border-box;
        text-align: center;
      }
      .home-screen-only {
        display: none;
      }
      .home-screen .home-screen-only {
        display: block;
      }
      a {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Timer has moved to <a id="link" href="https://colorchime.com/">colorchime.com</a>.</p>
      <div class="home-screen-only">
        <p>To keep using it from your home screen, open the link above, then use your browser's Share menu to add it to your Home Screen again.</p>
        <p>You can then delete this old icon.</p>
      </div>
    </main>
  </body>
</html>
